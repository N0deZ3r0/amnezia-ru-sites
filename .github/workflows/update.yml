name: Обновление списков

on:
  schedule:
    - cron: "0 4 * * 1"   # каждый понедельник в 04:00 UTC (07:00 по Москве)
  workflow_dispatch:       # и вручную: вкладка Actions → Обновление списков → Run workflow

jobs:
  update:
    name: Пересобрать списки
    runs-on: ubuntu-latest

    # нужно, чтобы закоммитить обновлённые списки обратно в репозиторий
    permissions:
      contents: write

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install dnspython

      - name: Проверить, что тесты проходят
        run: python -m unittest discover -s tests

      # Если новая сборка заметно меньше старой (не ответили источники или DNS),
      # шаг падает, и списки не перезаписываются.
      - name: Пересобрать списки
        run: python update.py --min-ratio 0.9

      - name: Закоммитить, если что-то изменилось
        run: |
          if git diff --quiet -- lists/; then
            echo "Списки не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists/
          git commit -m "Автообновление списков: $(date -u +%Y-%m-%d)"
          git push
